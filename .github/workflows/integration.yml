name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "service/uv.lock"

      - name: Install dependencies (locked)
        working-directory: service
        run: uv sync --locked

      # make test-integration ya encadena `dev-up` (docker compose up -d --wait) como
      # prerequisito de Make, y corre solo las pruebas marcadas `docker`. Los defaults de
      # Settings (service/procurawise/shared/config.py) ya coinciden con docker-compose.yml,
      # no hace falta declarar variables de entorno aquí.
      - name: make test-integration (Mongo + Azurite reales)
        run: make test-integration

      - name: Diagnóstico de Docker (solo si falla)
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::docker compose logs (mongo, azurite)"
          docker compose logs --no-color mongo azurite
          echo "::endgroup::"

      - name: Detener servicios Docker
        if: always()
        run: make dev-down
