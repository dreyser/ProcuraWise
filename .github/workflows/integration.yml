name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "service/uv.lock"

      - name: Install dependencies (locked)
        working-directory: service
        run: uv sync --locked

      # make test-integration ya encadena `dev-up` (docker compose up -d --wait) como
      # prerequisito de Make, y corre solo las pruebas marcadas `docker`. Los defaults de
      # Settings (service/procurawise/shared/config.py) ya coinciden con docker-compose.yml,
      # no hace falta declarar variables de entorno aquí.
      - name: make test-integration (Mongo + Azurite reales)
        run: make test-integration

      - name: Diagnóstico de Docker (solo si falla)
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::docker compose logs (mongo, azurite)"
          docker compose logs --no-color mongo azurite
          echo "::endgroup::"

      - name: Detener servicios Docker
        if: always()
        run: make dev-down

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "service/uv.lock"

      - name: Install backend dependencies (locked)
        working-directory: service
        run: uv sync --locked

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: apps/web/package.json

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies (frozen lockfile)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # make test-e2e encadena dev-up + seed-reset + seed-dev, levanta API y Vite en
      # background, espera su disponibilidad real, corre Playwright y limpia todo
      # (procesos + contenedores) al terminar, sin importar el resultado.
      - name: make test-e2e (flujo completo con backend real)
        run: make test-e2e

      - name: Subir evidencia de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 5
          if-no-files-found: ignore

      - name: Detener servicios Docker (red de seguridad)
        if: always()
        run: make dev-down
