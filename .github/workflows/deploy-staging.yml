name: Deploy Staging

# Fase 27 (ADR 0004/0005/0015/0019): despliegue real a staging vía OIDC
# federado - sin credenciales de larga vida en GitHub Secrets, solo
# identificadores públicos (AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID) que
# habilitan el intercambio de un token de corta duración en cada corrida
# (infra/scripts/bootstrap-oidc.md). El resource group y el bootstrap OIDC
# en sí son manuales, de una sola vez - este workflow nunca crea un
# resource group ni asigna roles (mínimo privilegio, plan §14).

# Solo manual hasta que el founder complete infra/scripts/bootstrap-oidc.md
# - AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID (GitHub Secrets)
# no existen todavía, así que `push: branches: [main]` haría que este
# workflow fallara en rojo en cada merge a main (falla en el paso de
# `azure/login`, antes de tocar nada - confirma que el resto del pipeline
# está bien formado, pero es ruido innecesario en cada PR mientras tanto).
# Una vez completado el bootstrap, descomentar el trigger `push` de abajo
# para volver al despliegue continuo automático.
on:
  # push:
  #   branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-procurawise-staging
  ACR_NAME: procurawiseacrstaging
  API_APP_NAME: procurawise-api-staging
  WEB_APP_NAME: procurawise-web-staging
  # Fase 28: mismo dominio real y estable del Container Apps Environment ya
  # usado en infra/params/staging.bicepparam (OIDC_REDIRECT_BASE_URL/
  # FRONTEND_BASE_URL) - horneado en el build del frontend (VITE_API_BASE_URL,
  # ver apps/web/src/lib/http.ts), no cambia entre deploys mientras no se
  # recree el entorno.
  API_BASE_URL: https://procurawise-api-staging.blueforest-f099b0ce.eastus2.azurecontainerapps.io

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC federado, sin secreto de larga vida)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow az CLI to auto-install extensions (containerapp)
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build + push api image
        run: |
          docker build -f service/Dockerfile.api -t "$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}" service
          docker push "$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}"

      - name: Build + push worker image
        run: |
          docker build -f service/Dockerfile.worker -t "$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}" service
          docker push "$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}"

      - name: Build + push web image
        run: |
          docker build -f apps/web/Dockerfile.web \
            --build-arg VITE_API_BASE_URL="$API_BASE_URL" \
            -t "$ACR_NAME.azurecr.io/procurawise-web:${{ github.sha }}" apps/web
          docker push "$ACR_NAME.azurecr.io/procurawise-web:${{ github.sha }}"

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/params/staging.bicepparam \
            --parameters apiImage="$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}" \
                         workerImage="$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}" \
                         webImage="$ACR_NAME.azurecr.io/procurawise-web:${{ github.sha }}"

      - name: Run database migrations
        # Ejecutado dentro del contenedor api ya desplegado (Settings() real,
        # completo, ya inyectado por Bicep - vs. reconstruirlo a mano en el
        # runner, que duplicaría toda la validación fail-closed de
        # shared/config.py). Conocido rough edge de MVP: `az containerapp
        # exec` no es un job dedicado, así que hay una ventana breve entre
        # "nueva revisión sirviendo tráfico" y "migración aplicada" - sin
        # requisito de zero-downtime en el backlog aprobado; candidato a
        # Microsoft.App/jobs si se necesita más adelante.
        #
        # `az containerapp exec` siempre intenta asignar un pseudo-terminal
        # local (`tty.setcbreak` sobre stdin) para relayar la sesión
        # interactiva por WebSocket, incluso con `--command` - el runner de
        # GitHub Actions no le da un TTY real a stdin, así que sin `script`
        # el paso falla con `termios.error: (25, 'Inappropriate ioctl for
        # device')` en cada corrida, confirmado contra un redeploy real.
        # `script -qec "<cmd>" /dev/null` (util-linux, ya presente en
        # ubuntu-latest) asigna un pseudo-terminal real para el hijo y
        # devuelve su código de salida real (`-e`), sin escribir el
        # typescript de la sesión a ningún archivo (`/dev/null`) - la salida
        # real del comando sigue apareciendo en el log del step como
        # siempre.
        run: |
          CMD="az containerapp exec --resource-group $RESOURCE_GROUP --name $API_APP_NAME --command \"python -m procurawise.shared.migrations\""
          script -qec "$CMD" /dev/null

      - name: Health check (api)
        run: |
          API_FQDN=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name main --query properties.outputs.apiFqdn.value -o tsv)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://$API_FQDN/health/ready" || true)
            if [ "$STATUS" = "200" ]; then
              echo "api healthy at https://$API_FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "api never became healthy (last status: $STATUS)" >&2
          exit 1

      - name: Health check (web)
        # Fase 28: nginx sirviendo estáticos no tiene un chequeo de salud
        # propio más significativo que "responde 200 en /" (mismo criterio
        # que livenessPath/readinessPath en modules/container-app.bicep).
        run: |
          WEB_FQDN=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name main --query properties.outputs.webFqdn.value -o tsv)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://$WEB_FQDN/" || true)
            if [ "$STATUS" = "200" ]; then
              echo "web healthy at https://$WEB_FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "web never became healthy (last status: $STATUS)" >&2
          exit 1
