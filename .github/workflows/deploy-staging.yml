name: Deploy Staging

# Fase 27 (ADR 0004/0005/0015/0019): despliegue real a staging vía OIDC
# federado - sin credenciales de larga vida en GitHub Secrets, solo
# identificadores públicos (AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID) que
# habilitan el intercambio de un token de corta duración en cada corrida
# (infra/scripts/bootstrap-oidc.md). El resource group y el bootstrap OIDC
# en sí son manuales, de una sola vez - este workflow nunca crea un
# resource group ni asigna roles (mínimo privilegio, plan §14).

# Solo manual hasta que el founder complete infra/scripts/bootstrap-oidc.md
# - AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID (GitHub Secrets)
# no existen todavía, así que `push: branches: [main]` haría que este
# workflow fallara en rojo en cada merge a main (falla en el paso de
# `azure/login`, antes de tocar nada - confirma que el resto del pipeline
# está bien formado, pero es ruido innecesario en cada PR mientras tanto).
# Una vez completado el bootstrap, descomentar el trigger `push` de abajo
# para volver al despliegue continuo automático.
on:
  # push:
  #   branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-procurawise-staging
  ACR_NAME: procurawiseacrstaging
  API_APP_NAME: procurawise-api-staging

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Azure login (OIDC federado, sin secreto de larga vida)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow az CLI to auto-install extensions (containerapp)
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build + push api image
        run: |
          docker build -f service/Dockerfile.api -t "$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}" service
          docker push "$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}"

      - name: Build + push worker image
        run: |
          docker build -f service/Dockerfile.worker -t "$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}" service
          docker push "$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}"

      - name: Deploy infrastructure (Bicep)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/params/staging.bicepparam \
            --parameters apiImage="$ACR_NAME.azurecr.io/procurawise-api:${{ github.sha }}" \
                         workerImage="$ACR_NAME.azurecr.io/procurawise-worker:${{ github.sha }}"

      - name: Run database migrations
        # Ejecutado dentro del contenedor api ya desplegado (Settings() real,
        # completo, ya inyectado por Bicep - vs. reconstruirlo a mano en el
        # runner, que duplicaría toda la validación fail-closed de
        # shared/config.py). Conocido rough edge de MVP: `az containerapp
        # exec` no es un job dedicado, así que hay una ventana breve entre
        # "nueva revisión sirviendo tráfico" y "migración aplicada" - sin
        # requisito de zero-downtime en el backlog aprobado; candidato a
        # Microsoft.App/jobs si se necesita más adelante.
        run: |
          az containerapp exec \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --command "python -m procurawise.shared.migrations"

      - name: Health check
        run: |
          API_FQDN=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name main --query properties.outputs.apiFqdn.value -o tsv)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://$API_FQDN/health/ready" || true)
            if [ "$STATUS" = "200" ]; then
              echo "api healthy at https://$API_FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "api never became healthy (last status: $STATUS)" >&2
          exit 1
