name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Detecta CVEs nuevos publicados contra dependencias ya existentes, sin que cambie el código.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      # Se descarga el binario de gitleaks directamente (verificado por checksum SHA-256)
      # en vez de usar la Action wrapper gitleaks/gitleaks-action, para evitar cualquier
      # ambigüedad de licenciamiento de esa Action en repositorios privados.
      - name: Descargar gitleaks 8.30.1 (verificado por checksum)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          CHECKSUM="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${CHECKSUM}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: gitleaks detect
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  python-deps:
    name: python-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "service/uv.lock"

      - name: Exportar requirements desde uv.lock
        working-directory: service
        run: uv export --no-hashes -o requirements.txt

      - name: pip-audit (informativo — no bloquea el PR en esta fase)
        working-directory: service
        run: |
          uvx pip-audit@2.10.1 -r requirements.txt || \
            echo "::warning::pip-audit encontró hallazgos. No bloquea el PR todavía — ver docs/security/threat-model.md. Revisar el log de este job."

  frontend-deps:
    name: frontend-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (informativo — no bloquea el PR en esta fase)
        working-directory: apps/web
        run: |
          pnpm audit || \
            echo "::warning::pnpm audit encontró hallazgos. No bloquea el PR todavía — ver docs/security/threat-model.md. Revisar el log de este job."
