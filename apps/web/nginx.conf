# Fase 28: solo archivos estáticos + fallback de rutas de SPA - sin proxy,
# sin lógica de backend (decisión del founder). `/` sirve como señal de
# liveness/readiness para Container Apps (infra/bicep/modules/container-app.bicep,
# livenessPath/readinessPath) - un servidor de archivos estáticos no tiene
# un chequeo de salud propio más significativo que "responde 200".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
