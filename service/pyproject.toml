[project]
name = "procurawise"
version = "0.1.0"
description = "ProcuraWise backend monolith (API + worker, shared domain package)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pymongo>=4.9",
    "azure-storage-blob>=12.23",
    # AUTH-PROD (ADR 0003): JWT propio + OIDC Microsoft/Google + hashing de
    # contraseñas. httpx promovido desde dev: el cliente async de authlib lo
    # necesita en runtime (intercambio de code/tokens con el IdP), no solo en
    # tests.
    "authlib>=1.3",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    # id_token (JWS/JWK) verification - authlib's own `authlib.jose` is
    # deprecated in favor of this since authlib 1.7; declared directly
    # rather than relying on it being pulled in transitively by authlib.
    "joserfc>=1.0",
    # Fase 13 (ai, ADR 0021): `openai` is the official SDK for both OpenAI
    # and Azure OpenAI (via its `AzureOpenAI` client) - not a separate
    # "azure-ai" package. `azure-servicebus` backs the first real
    # cross-process MessageBus adapter (ADR 0005/0020: "arrives with the
    # first async job, Fase 13+"). Neither reopens architecture already
    # approved by those ADRs - both execute previously-approved decisions.
    "openai>=2.52.0",
    "azure-servicebus>=7.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-authlib>=1.7.2.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procurawise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=procurawise --cov-report=term-missing --cov-report=xml"
markers = [
    "docker: requires local Docker services (mongo/azurite) via `make dev-up`",
    # Fase 13 (ai, ADR 0021): separate from `docker` because the Service Bus
    # emulator is an opt-in profile (`--profile servicebus`), not part of the
    # default `make dev-up` set (ADR 0020) - `make test-integration` must not
    # start failing for everyone just because this profile isn't running.
    "docker_servicebus: requires the Service Bus emulator profile via `make dev-up-servicebus`",
]

[tool.coverage.run]
source = ["procurawise"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/etc. are meant to be called in argument
# defaults - that's how the dependency-injection system works, not a mutable
# default value bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
