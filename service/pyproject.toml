[project]
name = "procurawise"
version = "0.1.0"
description = "ProcuraWise backend monolith (API + worker, shared domain package)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pymongo>=4.9",
    "azure-storage-blob>=12.23",
    # AUTH-PROD (ADR 0003): JWT propio + OIDC Microsoft/Google + hashing de
    # contraseñas. httpx promovido desde dev: el cliente async de authlib lo
    # necesita en runtime (intercambio de code/tokens con el IdP), no solo en
    # tests.
    "authlib>=1.3",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    # id_token (JWS/JWK) verification - authlib's own `authlib.jose` is
    # deprecated in favor of this since authlib 1.7; declared directly
    # rather than relying on it being pulled in transitively by authlib.
    "joserfc>=1.0",
    # Fase 13 (ai, ADR 0021): `openai` is the official SDK for both OpenAI
    # and Azure OpenAI (via its `AzureOpenAI` client) - not a separate
    # "azure-ai" package. `azure-servicebus` backs the first real
    # cross-process MessageBus adapter (ADR 0005/0020: "arrives with the
    # first async job, Fase 13+"). Neither reopens architecture already
    # approved by those ADRs - both execute previously-approved decisions.
    "openai>=2.52.0",
    "azure-servicebus>=7.14.3",
    # Fase 14 (ResearchProvider completo, ADR 0011): FoundryWebSearchProvider
    # calls the Foundry Responses API directly over `httpx` (already a
    # dependency) - no `azure-ai-projects`/`azure-ai-agents` SDK is added,
    # per the founder's Fase 14 planning decision to prefer direct REST over
    # a heavy agent/toolbox SDK. `azure-identity` is the one narrow
    # exception: the Responses API authenticates with Entra ID Bearer tokens,
    # not a static API key (unlike Azure OpenAI's azure_openai_api_key), and
    # hand-rolling OAuth2 client-credentials token acquisition/caching would
    # just reinvent what this small, official, single-purpose credential
    # library already does. It is not itself an AI/agent SDK.
    "azure-identity>=1.19",
    # Fase 16 (documents: carga vía multipart/form-data) - FastAPI's own
    # required, pure-Python dependency for UploadFile/Form parsing (no
    # native/system dependency, unlike the python-magic/libmagic option
    # deliberately rejected for magic-byte sniffing, see documents/service.py).
    "python-multipart>=0.0.20",
    # Fase 23 (reports, ADR 0023): report generation - all three are
    # pure-Python (no apt/system packages, unlike WeasyPrint or a headless
    # browser), confined to reports/renderers/*.py only (same import-boundary
    # principle CLAUDE.md S5.1 already applies to `ai/`). openpyxl is also
    # reused to *read* .xlsx uploads for the Fase 23 requirements import.
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # Fase 24 (notifications, ADR 0024): official ACS email SDK, confined to
    # notifications/azure_acs_email_provider.py only (same import-boundary
    # principle as ai/ and reports/).
    "azure-communication-email>=1.0",
    # Fase 25 (billing/admin, ADR 0025): official Stripe SDK, confined to
    # billing/stripe_payment_provider.py only (same import-boundary
    # principle as ai/, reports/, and notifications/).
    "stripe>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-authlib>=1.7.2.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procurawise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=procurawise --cov-report=term-missing --cov-report=xml"
markers = [
    "docker: requires local Docker services (mongo/azurite) via `make dev-up`",
    # Fase 13 (ai, ADR 0021): separate from `docker` because the Service Bus
    # emulator is an opt-in profile (`--profile servicebus`), not part of the
    # default `make dev-up` set (ADR 0020) - `make test-integration` must not
    # start failing for everyone just because this profile isn't running.
    "docker_servicebus: requires the Service Bus emulator profile via `make dev-up-servicebus`",
    # Fase 25 (billing, ADR 0025): opt-in only, real network call to Stripe
    # test mode - requires STRIPE_SECRET_KEY/STRIPE_PRICE_ID_EVALUATION
    # exported manually (see docs/operations/deployment.md). Never selected
    # by `make test`/`make test-integration` - run explicitly with
    # `pytest -m stripe_sandbox`.
    "stripe_sandbox: opt-in, requires a real Stripe test-mode account (never runs in CI)",
]

[tool.coverage.run]
source = ["procurawise"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/etc. are meant to be called in argument
# defaults - that's how the dependency-injection system works, not a mutable
# default value bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false

# Fase 23 (ADR 0023): none of the three report-generation libraries ship
# complete type stubs.
[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*", "docx.*"]
ignore_missing_imports = true

# Fase 24 (ADR 0024): azure-communication-email ships no type stubs.
[[tool.mypy.overrides]]
module = ["azure.communication.email.*"]
ignore_missing_imports = true
